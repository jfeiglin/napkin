# Who plays each part that the old model gave a role: each entity and template, and each event and
# case of an event, the actor of its timeline cards (an outcome's, else its event's, else its
# entity's: tools/publish/pages.py, `Pages.cards`, at 8488047). Who plays a part belongs to the
# scenario's wrapper (PLAN.md, changes 19 and 23 after G0); the publisher reads it here, and the
# pictures read who plays each entity and template from the [role] of style.toml.

[entities]
"attacker" = "adversary"
"deliveries" = "operator"
"high_risk_patients" = "community"
"hospitals" = "responder"
"manufacturer" = "operator"
"other_care_reserve" = "environment"
"other_makers" = "environment"
"records" = "operator"
"release_systems" = "operator"
"release_team" = "operator"
"resuscitation_patients" = "community"
"resuscitation_reserve" = "environment"

[events]
"attacker.alter_on_procurement.STOPPED" = "operator"
"attacker.alter_on_restart.STOPPED" = "operator"
"manufacturer.stops_shipping" = "environment"
"manufacturer.study_ends" = "environment"
