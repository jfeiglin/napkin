[layout]
cards_per_column = 9                     # the five stages and the four channels share column 2
card_width = 280                         # wide rows show more of the long names of the stocks

# The columns follow the story: the leaders, AI and the experts; the work of an attack; the two
# missions and the researchers; the pools of capabilities and the defenders; the planners.
[place]
ai_tools               = { column = 1, row = 1 }
leadership             = { column = 1, row = 2 }
operators              = { column = 1, row = 3 }
analysts               = { column = 1, row = 4 }
collection_specialists = { column = 1, row = 5 }
Stage                  = { column = 2, row = 1 }
Channel                = { column = 2, row = 6 }
surveillance_program   = { column = 3, row = 1 }
effects_program        = { column = 3, row = 2 }
researchers            = { column = 3, row = 3 }
other_states           = { column = 3, row = 4 }
Pool                   = { column = 4, row = 1 }
defenders              = { column = 4, row = 5 }
military_planners      = { column = 5, row = 1 }
Plan                   = { column = 5, row = 2 }

[group]
"Pools of capabilities"  = ["Pool"]
"Plans of cyber attacks" = ["Plan"]

[stocks]
effects_program = ["know_how", "held_ready", "assessing", "attacks_made"]
Pool            = ["fresh", "spy_used", "kept_attack", "burned"]

[triggers]
rules = ["leadership", "military_planners"]
names = ["effects_program"]

[equations]
things = ["surveillance_program", "defenders"]
width = 1400

[references]
show = true

# The deployments of implants: the first letter gives the capability to move inside the network, the
# second the capability to collect. f: a known flaw or a capability in use, k: kept, n: new.
[symbol.surveillance_program]
deploy_free_free = "d_sp,ff"
deploy_free_new  = "d_sp,fn"
deploy_kept_free = "d_sp,kf"
deploy_kept_new  = "d_sp,kn"
deploy_new_free  = "d_sp,nf"
deploy_new_new   = "d_sp,nn"

[symbol.Pool]
spy_part_free = "f"
spy_part_kept = "k"
spy_part_new  = "n"

[symbol.defenders]
threat = "theta_d"

[subscript]
movement_pool = "mv"

[icon]
people = ["leadership", "researchers", "operators", "collection_specialists", "analysts", "military_planners"]
server = ["surveillance_program"]
shield = ["defenders"]
gauge  = ["ai_tools", "other_states"]
