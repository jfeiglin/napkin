# What the briefs show first (scenarios/docs/catalogue.md). The calculation never reads it.
show = ["total_attacks", "attacks_per_year", "attacks_started", "capabilities_held", "share_on_attacks",
    "surveillance_return", "surveillance_accesses", "surveillance_implants", "success_per_target",
    "defender_attention", "access_work", "payload_work", "assessment_work", "plan_chance", "shared_loss",
    "best_plan_length", "doctrine_length", "lesson_weight", "value_to_cost", "expert_ratio", "targets_hit",
    "targets_per_attack", "new_access", "lessons_gained", "lessons_lost", "assessment_signal",
    "analysis_served", "analysts_on_attacks", "surveillance_planned", "spending", "passes", "misses",
    "deaths", "casualties", "economic_loss"]
drivers = ["access_stage.ai_end", "surveillance_program.run_ai_end", "effects_program.targets_end",
    "effects_program.prior_strength", "defenders.force_share", "effects_program.forget_rate",
    "leadership.steepness", "defenders.common_spread"]
featured = ["ai_fast", "no_ai"]
# The name of the attack on the pages, and the group of options that holds the responses of the
# defenders.
attack = "Attacks of the country's cyber force"
choice_group = "Response"

# The spreads that the brief shows: each samples its runs under the edit document
# spreads/<id>.json, which gives some inputs their distributions.

[[spread]]
id = "doctrine_probability"
description = """\
    The chance that military plans count on cyber attacks in each pathway with one objective. Four values of \
    the planners and the defenders vary over their ranges."""
runs = ["no_ai", "ai_fast", "ai_slow", "defenders_ai", "ai_fast_lessons"]
samples = 160
seed = 4501
method = "random"
outputs = ["doctrine_counts", "plan_chance", "plan_margin"]

[[spread]]
id = "tipping_corner"
description = """\
    Without AI progress, lessons have half of their weight after 300 assessed outcomes, and the learning \
    curve has the shape 3. Only the error of each yearly assessment changes between the calculations."""
runs = ["no_ai"]
samples = 100
seed = 4501
method = "random"
outputs = ["attacks_per_year", "share_on_attacks", "doctrine_counts", "attacks_rise"]
