# The map follows the observed outage, the utility response and access to cooling.
[layout]
stocks = 3
cards_per_column = 9                     # the nine groups of people stay in one column
card_width = 180                         # room for the title "Compound buildings"

[place]
incident = { column = 1, row = 1 }
extra = { column = 2, row = 1 }
heat_wave                = { column = 1, row = 3 }
crews                    = { column = 2, row = 2 }
utility                  = { column = 2, row = 4 }
supply                   = { column = 3 }
compound                 = { column = 4, row = 1 }
devices                  = { column = 4, row = 2 }
outreach                 = { column = 4, row = 3 }
hospitals                = { column = 4, row = 4 }
homes                    = { column = 5, row = 1 }
under_65                 = { column = 5, row = 2 }
aged_65_to_74            = { column = 5, row = 3 }
aged_75_and_over         = { column = 5, row = 4 }
compound_buildings       = { column = 5, row = 5 }
Residents                = { column = 6, row = 1 }
DeviceUsers              = { column = 6, row = 4 }
Confined                 = { column = 6, row = 7 }
# People move into the cooled places, so the places come after the people.
moves                    = { column = 7, row = 1 }
places                   = { column = 7, row = 2 }
residential              = { column = 7, row = 3 }
non_residential          = { column = 7, row = 4 }

# Only the people have frames: each frame takes a band of the whole width of the picture.
[group]
"Residents in homes"          = ["Residents"]
"Device users"                = ["DeviceUsers"]
"People held in the compound" = ["Confined"]

[stocks]
crews       = ["remaining", "rework_left", "completed"]
Residents   = ["wait_h", "formal_h", "dead"]
DeviceUsers = ["dark_h", "supported", "dead"]
Confined    = ["exposed_h", "formal_h", "dead"]

[arrows]
bundle = ["reads", "follows", "fires"]   # places and outreach fire the events of six and three groups

[icon]
sun    = ["heat_wave"]
house  = ["Buildings", "places", "compound"]
bolt   = ["supply", "devices"]
shield = ["utility"]
wrench = ["crews"]
truck  = ["moves"]
money  = ["Customers"]

# Who plays each thing: the old model's `role` lines (docs/design/decisions.md, change 23).
[role]
environment = ["heat_wave", "Buildings", "supply", "devices", "incident", "extra"]
community = ["AgeBand", "moves", "Customers", "Residents", "DeviceUsers", "Confined"]
utility = ["crews", "utility"]
responder = ["places", "compound", "outreach"]
clinician = ["hospitals"]

[triggers]
rules = ["supply"]
lines = 3
names = ["utility", "crews", "outreach", "Residents", "DeviceUsers", "Confined"]
count = ["heat_wave", "places", "moves", "compound", "devices"]

[equations]
things = ["crews", "supply"]
width = 1000

[references]
show = true

[symbol.crews]
remaining     = "R_cr"
completed     = "C_cr"
rework_left   = "Q_cr"
rework_done   = "Q_cr,d"
rework_caused = "Q_cr,c"
work          = "w_cr"

[symbol.supply]
service             = "sigma_s"
hours_without_power = "H_s"
