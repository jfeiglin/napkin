show = ["deaths", "casualties", "late_deaths", "economic_loss", "supply.resident_hours", "thermal_exposure",
    "device_admissions", "places.admissions", "outstanding_work"]
# The inputs that the brief lists.
drivers = ["supply.people_served", "compound.held", "heat_wave.outdoor", "heat_wave.cap", "homes.slope",
    "homes.heat_up_time", "contractor.review_time", "ai.obeys", "contractor.removal_time",
    "utility.check_time", "crews.work", "ai.rework_share", "job.run_time"]
featured = ["delayed_refuses", "delayed_obeys"]
# The name of the attack on the pages, and the group of options that holds the responses of the
# defenders.
attack = "unauthorized interruption of a shared electricity supply by an authorized disruption operation"
choice_group = "Response"

# The rows of the run table after the runs: each sweep runs one run with other values of some
# inputs (`set`, by the names that edits give them, in the units of the inputs).

