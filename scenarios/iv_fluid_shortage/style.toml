# The columns follow the story: the attacker, the manufacturer's systems, its teams, the supply to the
# hospitals, then the reserves and the patients.
[place]
attacker               = { column = 1 }
release_systems        = { column = 2 }
records                = { column = 2 }
manufacturer           = { column = 3 }
release_team           = { column = 3 }
other_makers           = { column = 4 }
deliveries             = { column = 4 }
hospitals              = { column = 4 }
other_care_reserve     = { column = 5, row = 1 }
resuscitation_reserve  = { column = 5, row = 2 }
resuscitation_patients = { column = 5, row = 3 }
high_risk_patients     = { column = 5, row = 4 }

[icon]
factory  = ["manufacturer", "other_makers"]
document = ["records"]
box      = ["resuscitation_reserve", "other_care_reserve"]
truck    = ["deliveries"]
wrench   = ["release_team"]
hospital = ["hospitals"]

[state.release_systems]
credentials = "beside"   # the card then holds two machines, one in each row: its column is narrower

[triggers]
rules = ["attacker", "manufacturer"]
names = ["hospitals", "deliveries", "resuscitation_reserve", "other_care_reserve"]
count = ["release_team"]   # the machine of the release team names its events
lines = 3

[equations]
things = ["resuscitation_reserve", "resuscitation_patients", "high_risk_patients"]
width  = 1000

[references]
show = true

[subscript]
resuscitation_reserve  = "r"
resuscitation_patients = "p"
high_risk_patients     = "hr"

[symbol.resuscitation_reserve]
stock      = "F_r"
unmet_rate = "m_r"

[symbol.resuscitation_patients]
course_volume   = "v_p"
miss_rate       = "m_p"
complete_course = "c_p"

[symbol.other_makers]
supply_rate       = "s_o"
to_hospitals_rate = "q_o"

[symbol.deliveries]
delivery_rate = "q_d"
