# The picture of each place that has no style.toml of its own. It names the templates, not the
# systems of one place, so that it holds for each of those places.

[layout]
stocks = 6
card_width = 320

[place]

responders = { column = 1, row = 2 }

Utility    = { column = 3 }
CrewPool   = { column = 4 }
parts      = { column = 4 }
relief     = { column = 5 }
Households = { column = 6 }
Hospitals  = { column = 6 }

[group]
"Repair crews" = ["CrewPool"]

[icon]
drop     = ["Utility", "relief"]
wrench   = ["CrewPool"]
box      = ["parts"]
house    = ["Households"]
hospital = ["Hospitals"]

# Who plays each thing: the old model's `role` lines (docs/design/decisions.md, change 23).
[role]
operator = ["incident", "Utility", "Tie"]

responder = ["responders", "CrewPool", "relief", "support"]
environment = ["parts"]
community = ["Households"]
clinician = ["Hospitals"]

# Each of these three only marks one part of the repair as done; "Controls" shows the repair.
[state.Utility]
controls_fixed = "hidden"
field_fixed    = "hidden"
parts_fixed    = "hidden"

[stocks]
Utility = ["finished", "room", "controls_work", "field_work", "unserved", "direct_loss"]

[triggers]
rules = ["Utility"]
names = ["incident", "responders", "parts", "relief", "Hospitals"]
count = ["CrewPool"]

[equations]
things = ["Utility", "Households", "Hospitals"]
width = 1100

[references]
show = true

[symbol.Utility]
finished        = "W"
supply_rate     = "q"
supply_full     = "Q"
production_rate = "p"
purchases       = "b"
own_rate        = "o"
demand          = "delta"
export_rate     = "e"
leak_rate       = "l"
service         = "s"
