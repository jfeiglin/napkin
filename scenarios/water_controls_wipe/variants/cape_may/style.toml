# The package's picture without the hospitals, which the model of this place does not have.

[layout]
stocks = 6
card_width = 320

[place]
attacker   = { column = 1, row = 1 }
responders = { column = 1, row = 2 }
platform   = { column = 2 }
Utility    = { column = 3 }
CrewPool   = { column = 4 }
parts      = { column = 4 }
relief     = { column = 5 }
Households = { column = 6 }

[group]
"Repair crews" = ["CrewPool"]

[icon]
drop   = ["Utility", "relief"]
wrench = ["CrewPool"]
box    = ["parts"]
house  = ["Households"]

# Each of these three only marks one part of the repair as done; "Controls" shows the repair.
[state.Utility]
controls_fixed = "hidden"
field_fixed    = "hidden"
parts_fixed    = "hidden"

[stocks]
Utility = ["finished", "room", "controls_work", "field_work", "unserved", "direct_loss"]

[triggers]
rules = ["attacker", "Utility"]
names = ["platform", "responders", "parts", "relief"]
count = ["CrewPool"]

[equations]
things = ["Utility", "Households"]
width = 1100

[references]
show = true

[symbol.Utility]
finished        = "W"
supply_rate     = "q"
supply_full     = "Q"
production_rate = "p"
purchases       = "b"
own_rate        = "o"
demand          = "delta"
export_rate     = "e"
leak_rate       = "l"
service         = "s"
