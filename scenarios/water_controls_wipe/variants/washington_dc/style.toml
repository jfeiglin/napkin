# The Aqueduct and WSSC Water, then the ties, the crews and the parts that every system shares,
# then the three systems that buy from the Aqueduct.

[layout]
stocks = 6
card_width = 320

[place]

responders          = { column = 1, row = 2 }

washington_aqueduct = { column = 3, row = 1 }
wssc_water          = { column = 3, row = 2 }
Tie                 = { column = 4, row = 1 }
CrewPool            = { column = 4, row = 4 }
parts               = { column = 4, row = 6 }
dc_water            = { column = 5, row = 1 }
arlington           = { column = 5, row = 2 }
fairfax_water       = { column = 5, row = 3 }
relief              = { column = 6 }
Households          = { column = 7 }
Hospitals           = { column = 7 }

[group]
"Repair crews" = ["CrewPool"]

[icon]
drop     = ["Utility", "relief"]
pipe     = ["Tie"]
wrench   = ["CrewPool"]
box      = ["parts"]
house    = ["Households"]
hospital = ["Hospitals"]

# Who plays each thing: the old model's `role` lines (PLAN.md, change 23 after G0).
[role]
operator = ["incident", "Utility", "Tie"]

responder = ["responders", "CrewPool", "relief"]
environment = ["parts"]
community = ["Households"]
clinician = ["Hospitals"]

# Each of these three only marks one part of the repair as done; "Controls" shows the repair.
[state.Utility]
controls_fixed = "hidden"
field_fixed    = "hidden"
parts_fixed    = "hidden"

[stocks]
Utility = ["finished", "room", "controls_work", "field_work", "unserved", "direct_loss"]

[triggers]
rules = ["washington_aqueduct"]
names = ["incident", "responders", "parts", "relief", "Hospitals"]
count = ["CrewPool", "dc_water", "arlington", "fairfax_water", "wssc_water"]

[equations]
things = ["dc_water", "dc_water_homes", "dc_water_hospitals"]
width = 1100

[references]
show = true

[symbol.Utility]
finished        = "W"
supply_rate     = "q"
supply_full     = "Q"
production_rate = "p"
purchases       = "b"
own_rate        = "o"
demand          = "delta"
export_rate     = "e"
leak_rate       = "l"
service         = "s"
