# The seller, the tie and the buyer go down one column, in the order of the sale.

[layout]
stocks = 6
card_width = 320

[place]

responders    = { column = 1, row = 2 }

minot         = { column = 3, row = 1 }
minot_to_naws = { column = 3, row = 2 }
naws          = { column = 3, row = 3 }
CrewPool      = { column = 4 }
parts         = { column = 4 }
relief        = { column = 5 }
Households    = { column = 6 }
Hospitals     = { column = 6 }

[group]
"Repair crews" = ["CrewPool"]

[icon]
drop     = ["Utility", "relief"]
pipe     = ["Tie"]
wrench   = ["CrewPool"]
box      = ["parts"]
house    = ["Households"]
hospital = ["Hospitals"]

# Who plays each thing: the old model's `role` lines (PLAN.md, change 23 after G0).
[role]
operator = ["incident", "Utility", "Tie"]

responder = ["responders", "CrewPool", "relief"]
environment = ["parts"]
community = ["Households"]
clinician = ["Hospitals"]

# Each of these three only marks one part of the repair as done; "Controls" shows the repair.
[state.Utility]
controls_fixed = "hidden"
field_fixed    = "hidden"
parts_fixed    = "hidden"

[stocks]
Utility = ["finished", "room", "controls_work", "field_work", "unserved", "direct_loss"]

[triggers]
rules = ["minot"]
names = ["incident", "responders", "parts", "relief", "Hospitals"]
count = ["CrewPool", "naws"]

[equations]
things = ["minot", "minot_homes", "minot_hospitals"]
width = 1100

[references]
show = true

[symbol.Utility]
finished        = "W"
supply_rate     = "q"
supply_full     = "Q"
production_rate = "p"
purchases       = "b"
own_rate        = "o"
demand          = "delta"
export_rate     = "e"
leak_rate       = "l"
service         = "s"
